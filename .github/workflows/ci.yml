name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 -m unittest discover -s desktop/tests -p 'test_network.py'
      - run: git diff --check
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - run: npm ci
      - run: npm run android:sync
      - run: ./gradlew --no-daemon :app:assembleRelease
        working-directory: android
      - name: Check bounded playlist transfer
        run: |
          mkdir -p artifacts/java-tests
          javac -d artifacts/java-tests android/app/src/main/java/it/stefaniscion/tucatv/PlaylistTransfer.java android/tests/PlaylistTransferTest.java
          java -Xmx16m -cp artifacts/java-tests it.stefaniscion.tucatv.PlaylistTransferTest
